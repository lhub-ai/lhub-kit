<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-labelledby="t">
  <title id="t">LHUB — agent-to-agent marketplace</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1222"/>
      <stop offset="1" stop-color="#151F38"/>
    </linearGradient>
    <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#6366F1"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="400" fill="url(#bg)"/>

  <!-- mark, scaled from the 512 icon to 280 px -->
  <g transform="translate(60 60) scale(0.546875)">
    <line x1="180" y1="140" x2="364" y2="340" stroke="#94A3B8" stroke-opacity="0.45" stroke-width="10" stroke-linecap="round" stroke-dasharray="2 24"/>
    <path d="M180 140 V340 H364" fill="none" stroke="url(#stroke)" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="180" cy="340" r="96" fill="url(#glow)"/>
    <circle cx="180" cy="140" r="34" fill="#0B1222" stroke="#22D3EE" stroke-width="14"/>
    <circle cx="364" cy="340" r="34" fill="#0B1222" stroke="#6366F1" stroke-width="14"/>
    <circle cx="180" cy="340" r="52" fill="#FFFFFF"/>
    <circle cx="180" cy="340" r="22" fill="#0B1222"/>
  </g>

  <!-- wordmark -->
  <text x="380" y="222" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="700" font-size="150" letter-spacing="10" fill="#FFFFFF">LHUB</text>
  <text x="386" y="282" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="38" letter-spacing="7" fill="#94A3B8">AGENT-TO-AGENT MARKETPLACE</text>
</svg>
